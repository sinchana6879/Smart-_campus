<!DOCTYPE html>
<html>
<head>
<title>Thank You</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family: Arial;
    color: white;
}

.card {
    text-align:center;
    padding:30px;
    border-radius:20px;
    background:white;
    color:black;
    width:320px;
}

h2 {
    color:#2a5298;
}

.btn-home {
    background:#2a5298;
    color:white;
    width:100%;
}
</style>
</head>

<body>

<div class="card shadow">

<h2>🎉 Booking Successful</h2>

<p>Thank you for using <b>Smart Campus</b>!</p>

<p>Your booking has been confirmed successfully.</p>

<button class="btn btn-home mt-3" onclick="goHome()">Go to Home</button>

</div>

<script>
function goHome(){
    window.location.href = "index.html";
}
</script>

</body>
</html>
