<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap + Chart.js -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: linear-gradient(to bottom, #1e3c72, #2a5298);
            color: white;
            font-family: Arial;
        }

        .container {
            margin-top: 30px;
        }

        .card {
            border-radius: 15px;
            padding: 15px;
            background: white;
            color: black;
        }
    </style>
</head>

<body>

<div class="container">

    <h3 class="text-center mb-4">Admin Dashboard 📊</h3>

    <!-- Stats -->
    <div class="row text-center mb-4">
        <div class="col">
            <div class="card">
                <h5>Total Bookings</h5>
                <p>120</p>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <h5>Peak Hour</h5>
                <p>11 AM</p>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <h5>Top Room</h5>
                <p>Room A</p>
            </div>
        </div>
    </div>

    <!-- Chart -->
    <div class="card">
        <h5 class="text-center">Room Usage</h5>
        <canvas id="chart"></canvas>
    </div>

</div>

<script>
const ctx = document.getElementById('chart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Room A', 'Room B'],
        datasets: [{
            label: 'Bookings',
            data: [70, 50],
            backgroundColor: ['blue', 'green']
        }]
    }
});
</script>

</body>
</html>
