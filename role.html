<!DOCTYPE html>
<html>
<head>
<title>Select User Type</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;justify-content:center;align-items:center;height:100vh;
}
.card {
    padding:20px;
    border-radius:20px;
    width:300px;
    text-align:center;
}
.btn {
    margin:10px 0;
    width:100%;
}
</style>
</head>

<body>

<div class="card bg-white shadow">
<h4>Select User Type</h4>

<button class="btn btn-primary" onclick="goInsider()">Insider</button>
<button class="btn btn-warning" onclick="goOutsider()">Outsider</button>
<button class="btn btn-dark" onclick="goAdmin()">Admin</button>

</div>

<script>
function goInsider(){
    window.location.href = "insider.html";
}

function goOutsider(){
    window.location.href = "outsider.html";
}

function goAdmin(){
    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
