<!DOCTYPE html>
<html>
<head>
<title>Classroom Booking</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family: Arial;
}

.card {
    width:350px;
    padding:20px;
    border-radius:20px;
}

h4 {
    text-align:center;
    color:#2a5298;
}

#result {
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card bg-white shadow">

<h4>🏫 Classroom Booking</h4>

<!-- CLASSROOM NUMBER INPUT -->
<input type="number" id="room" class="form-control mb-3" 
       placeholder="Enter Classroom (1–15)" min="1" max="15">

<!-- DATE -->
<input type="date" id="date" class="form-control mb-3">

<!-- TIME -->
<input type="time" id="time" class="form-control mb-2" min="09:00" max="17:00">
<small class="text-muted">Select time between 9AM – 5PM</small>

<!-- BUTTONS -->
<button class="btn btn-primary mt-3 w-100" onclick="check()">Check Availability</button>
<button class="btn btn-success mt-2 w-100" onclick="book()">Book Now</button>

<p id="result"></p>

</div>

<script>
let isAvailable = false;

async function check() {
    let room = document.getElementById("room").value;
    let time = document.getElementById("time").value;

    // validation
    if(room === "" || room < 1 || room > 15){
        alert("Enter classroom between 1 and 15");
        return;
    }

    if(time === ""){
        alert("Select time");
        return;
    }

    let res = await fetch("http://127.0.0.1:5000/check", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({room, time})
    });

    let data = await res.json();

    if(data.status === "available"){
        document.getElementById("result").innerHTML = "✅ Available";
        document.getElementById("result").style.color = "green";
        isAvailable = true;
    } else {
        document.getElementById("result").innerHTML = "❌ Busy";
        document.getElementById("result").style.color = "red";
        isAvailable = false;
    }
}

async function book() {
    if(!isAvailable){
        alert("❌ Check availability first");
        return;
    }

    let room = document.getElementById("room").value;
    let time = document.getElementById("time").value;

    await fetch("http://127.0.0.1:5000/book", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({room, time})
    });

    alert("✅ Booking Confirmed!");

    // Show QR
    document.getElementById("result").innerHTML =
        `<img src="http://127.0.0.1:5000/qr.png" width="150">`;
}
</script>

</body>
</html>
