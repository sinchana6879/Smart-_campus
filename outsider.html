<!DOCTYPE html>
<html>
<head>
<title>Outsider</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;justify-content:center;align-items:center;height:100vh;
}
.card {padding:20px;border-radius:20px;width:300px;text-align:center;}
.btn{margin:10px 0;width:100%;}
</style>
</head>

<body>

<div class="card bg-white shadow">
<h4>Outsider Access</h4>

<button class="btn btn-success" onclick="allow()">Admin Permission</button>
<button class="btn btn-danger" onclick="deny()">No Permission</button>

</div>

<script>
function allow(){
    window.location.href = "select.html";
}

function deny(){
    alert("❌ Access Denied");
}
</script>

</body>
</html>
