<!DOCTYPE html>
<html>
<head>
    <title>Smart Campus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .card {
            width: 360px;
            border-radius: 25px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        h4 {
            text-align: center;
            font-weight: bold;
            color: #2a5298;
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-custom {
            background: linear-gradient(45deg, #2a5298, #1e3c72);
            color: white;
            border-radius: 10px;
            width: 100%;
        }

        .btn-success {
            border-radius: 10px;
        }

        #result {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }

        .icon {
            margin-right: 8px;
        }
    </style>
</head>

<body>

<div class="card shadow bg-white">

    <h4><i class="bi bi-building"></i> Book Resource</h4>

    <select class="form-control mb-3">
        <option>🏫 Select Room</option>
        <option>Room A</option>
        <option>Room B</option>
    </select>

    <input type="date" class="form-control mb-3">

    <select class="form-control mb-3">
        <option>⏰ Select Time</option>
        <option>10-11 AM</option>
        <option>11-12 PM</option>
    </select>

    <button class="btn btn-custom mb-2" onclick="check()">
        <i class="bi bi-search"></i> Check Availability
    </button>

    <button class="btn btn-success mb-2" onclick="book()">
        <i class="bi bi-check-circle"></i> Book Now
    </button>

    <p id="result"></p>

    <a href="dashboard.html" class="btn btn-dark mt-2">
        <i class="bi bi-bar-chart"></i> Dashboard
    </a>

</div>


<script>
let isAvailable = false;

async function check() {
    let room = document.querySelectorAll("select")[0].value;
    let time = document.querySelectorAll("select")[1].value;

    let response = await fetch("http://127.0.0.1:5000/check", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ room: room, time: time })
    });

    let data = await response.json();

    if(data.status === "available") {
        document.getElementById("result").innerHTML = "✅ Available";
        document.getElementById("result").style.color = "green";
        isAvailable = true;
    } else {
        document.getElementById("result").innerHTML = "❌ Busy";
        document.getElementById("result").style.color = "red";
        isAvailable = false;
    }
}

async function book() {
    if(!isAvailable) {
        alert("❌ Cannot book");
        return;
    }

    let room = document.querySelectorAll("select")[0].value;
    let time = document.querySelectorAll("select")[1].value;

    await fetch("http://127.0.0.1:5000/book", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ room: room, time: time })
    });

    alert("✅ Booking Confirmed!");
}

</script>

</body>
</html>
